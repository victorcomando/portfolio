name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node.js e pnpm
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24
          cache: true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar o site
        run: pnpm build

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v4
